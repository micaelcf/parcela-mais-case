name: parcela-mais-case

# Every container and built image of this repo carries this label (ops scripts filter on it).
x-project-labels: &project-labels
  com.parcela.project: parcela-mais-case

# app, migrate and worker run the same image; identical builds hit the layer cache.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-dev}
    labels: *project-labels
  profiles: [prod]
  init: true
  env_file: .env
  environment: &app-env
    # Default: the bundled `postgres` service. Its URL carries no user, password or database;
    # node-postgres (drizzle, pg-boss) reads them from the libpq PG* variables below. No `${…}` nests
    # inside a default: podman-compose < 1.6 ends a default at its first `}`.
    # A managed Postgres: set STACK_DATABASE_URL in .env to its full URL (what it carries wins over
    # PG*). POSTGRES_PASSWORD stays required: the bundled `postgres` still starts and gates migrate.
    DATABASE_URL: ${STACK_DATABASE_URL:-postgres://postgres:5432}
    PGUSER: ${POSTGRES_USER:-parcela}
    PGPASSWORD: ${POSTGRES_PASSWORD:-}
    PGDATABASE: ${POSTGRES_DB:-parcela}
    LENDER_BASE_URL: http://app:3000/api/simulator/lenders
    GIT_SHA: ${GIT_SHA:-dev}
    # Same default as Caddy's site: the app serves it over HTTPS, so `bo_session` is Secure.
    APP_DOMAIN: ${APP_DOMAIN:-parcela.localhost}
    NODE_ENV: production
    # One JSON line per event for log pipelines (tslog; `TSLOG_TYPE=pretty` reads better by hand).
    TSLOG_TYPE: ${TSLOG_TYPE:-json}
  labels: *project-labels

services:
  # No host port and no default password here: compose.dev.yaml (only `vp run up` loads it)
  # publishes 5432 and supplies the dev password. Without POSTGRES_PASSWORD in .env the prod stack
  # fails closed (Postgres refuses to initialise, or the app's login is rejected).
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parcela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-parcela}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    labels: *project-labels

  migrate:
    <<: *app
    command: ["bun", "scripts/ops/migrate.ts"]
    # A service's own `environment` would replace the shared map (YAML merges are shallow): merge it.
    environment:
      <<: *app-env
      TSLOG_NAME: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    command: ["bun", ".output/server/index.mjs"]
    environment:
      <<: *app-env
      TSLOG_NAME: app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *app
    command: ["bun", "src/server/worker.main.ts"]
    environment:
      <<: *app-env
      TSLOG_NAME: worker
    restart: unless-stopped
    # boss.stop({ graceful: true, timeout: 15000 }) needs time after SIGTERM.
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker serves no HTTP: healthy while its process runs ([.] keeps pgrep off this shell).
      test: ["CMD-SHELL", "pgrep -f 'src/server/worker[.]main' > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  caddy:
    image: docker.io/library/caddy:2-alpine
    profiles: [prod]
    restart: unless-stopped
    # Same port inside and out: Caddy's HTTP→HTTPS redirect names its own https_port, which must be
    # the published one. A public APP_DOMAIN (ACME) needs HTTP_PORT=80 and HTTPS_PORT=443.
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    environment:
      # `*.localhost`: certificate from Caddy's local CA. A public domain: ACME. A bare
      # `:<HTTP_PORT>`: plain HTTP.
      APP_DOMAIN: ${APP_DOMAIN:-parcela.localhost}
      CADDY_UPSTREAM: app:3000
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # `vp run up --prod` sets CADDY_DATA=./.local/caddy: the same CA caddy-dev uses (they never run
      # together: same ports), trusted once per machine. `vp run deploy` keeps the named volume.
      - ${CADDY_DATA:-caddy_data}:/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # In-container check: Caddy's admin API binds IPv4 loopback only, and busybox wget tries ::1 for "localhost".
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels: *project-labels

volumes:
  pgdata:
  caddy_data:

name: parcela-mais-case

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: parcela
      POSTGRES_PASSWORD: parcela
      POSTGRES_DB: parcela
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcela -d parcela"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:

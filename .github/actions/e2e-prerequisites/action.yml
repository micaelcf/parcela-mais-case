name: E2E prerequisites
description: >-
  Playwright's Chromium (cached per Playwright version) with its system libraries, certutil for
  `bun run up` to trust Caddy's local CA in Chromium's NSS database, and parcela.localhost on IPv4
  loopback, where the stack publishes Caddy.

runs:
  using: composite
  steps:
    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Chromium
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright install chromium

    - name: Install system libraries and certutil
      shell: bash
      run: |
        bunx playwright install-deps chromium
        sudo apt-get install -y --no-install-recommends libnss3-tools

    - name: Resolve parcela.localhost to IPv4 loopback
      shell: bash
      run: echo "127.0.0.1 parcela.localhost" | sudo tee -a /etc/hosts
